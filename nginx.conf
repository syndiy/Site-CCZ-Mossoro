map $http_x_forwarded_proto $ccz_forwarded_proto {
    default $scheme;
    https https;
}

# IP real do visitante: o Caddy, na rede interna do Docker, repassa em X-Forwarded-For.
# Sem isto, os limites abaixo contariam todo mundo como o mesmo endereço.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Limites contra tentativa e erro de senha e envio automatizado de denúncias.
# Só POST conta: consultar a lista de denúncias no painel não entra no limite.
map $request_method $ccz_post_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $ccz_post_ip zone=ccz_login:10m rate=10r/m;
limit_req_zone $ccz_post_ip zone=ccz_denuncia:10m rate=6r/m;
# Teto geral da API e de conexões por IP: o Java roda numa VM pequena. Folgado,
# porque visitantes que chegam pela Cloudflare compartilham poucos IPs de saída.
limit_req_zone $binary_remote_addr zone=ccz_api:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=ccz_conexoes:10m;
limit_req_status 429;
limit_conn_status 429;

# Ferramentas de varredura que se identificam. (Muitos robôs fingem ser o Google;
# esses caem nos bloqueios de caminho abaixo.)
map $http_user_agent $ccz_varredura {
    default 0;
    ~*(zgrab|masscan|nmap|nikto|sqlmap|nuclei|zmeu|dirbuster|gobuster|wpscan|ffuf|feroxbuster|censys|l9explore|httpx) 1;
}

# Cache por tipo de arquivo, num lugar só (add_header em uma location apagaria
# os cabeçalhos de segurança do server).
map $uri $ccz_cache {
    ~^/_next/static/                                    "public, max-age=31536000, immutable";
    ~^/api/midia/                                       "public, max-age=31536000, immutable";
    ~^/api/                                             "no-store";
    ~\.(?:avif|webp|png|jpe?g|gif|svg|ico|woff2?)$      "public, max-age=604800";
    ~^/(?:feed\.xml|sitemap\.xml|robots\.txt|llms(?:-full)?\.txt)$ "public, max-age=3600";
    default                                             "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    limit_conn ccz_conexoes 60;

    # Robôs de varredura: fecha a conexão sem responder (444).
    if ($ccz_varredura) {
        return 444;
    }

    charset utf-8;

    # Imagens do painel usam nome aleatório e nunca mudam; HTML é sempre revalidado;
    # respostas da API (inclusive as autenticadas) não ficam em cache. Sem "always":
    # respostas de erro não recebem cache longo (uma falha momentânea não fica guardada).
    add_header Cache-Control $ccz_cache;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Parte da política que não afeta nenhum recurso do site: vale desde já.
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    # Política completa em modo de teste: o navegador só avisa no console o que
    # bloquearia. Depois de conferir mapa, CEP e VLibras em uso real, trocar para
    # Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net; connect-src 'self' https://viacep.com.br https://nominatim.openstreetmap.org https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src 'self' https://vlibras.gov.br https://*.vlibras.gov.br; media-src 'self' blob: https://*.vlibras.gov.br" always;

    # Os payloads do roteador do Next sao pedidos com ponto separando os segmentos
    # (__next.news.$d$slug.__PAGE__.txt) e gravados no export com barra
    # (__next.news/$d$slug/__PAGE__.txt). Troca um ponto por vez: o rewrite fica
    # dentro da location porque, no nivel do server, o "last" nao o executa de novo
    # e rotas com dois segmentos davam 404.
    location ~ "/__next\." {
        default_type text/x-component;
        rewrite "^(.*/__next\.[^/.]+(?:/[^/.]+)*)\.(.+\.txt)$" "$1/$2" last;
        try_files $uri =404;
    }

    # O que robôs de ataque procuram e o site nunca serve: arquivos ocultos (.env,
    # .git, .aws), scripts de outras plataformas e painéis conhecidos. Fecha a
    # conexão sem responder, para gastar o mínimo do servidor.
    location ~ "(^|/)\.(?!well-known/)" {
        return 444;
    }
    location ~* "\.(php[0-9]?|asp|aspx|jsp|cgi|env|ini|bak|old|orig|save|swp|sql|sh|ya?ml|conf|config|log|lock)$" {
        return 444;
    }
    location ~* "/(wp-admin|wp-includes|wp-content|wp-login|xmlrpc|phpmyadmin|pma|cgi-bin|vendor|actuator|server-status|boaform|hnap1|owa|autodiscover)(/|$)" {
        return 444;
    }

    location = /feed.xml {
        types { }
        default_type application/rss+xml;
    }

    client_max_body_size 10m;

    # Valem para todas as locations que encaminham ao Java.
    proxy_hide_header Cache-Control;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $ccz_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;

    location = /api/users/login {
        limit_req zone=ccz_login burst=5 nodelay;
        proxy_pass http://backend:8080/users/login;
    }

    location = /api/denuncia {
        limit_req zone=ccz_denuncia burst=3 nodelay;
        proxy_pass http://backend:8080/denuncia;
    }

    # Site, painel e Java compartilham a mesma URL publica.
    location /api/ {
        limit_req zone=ccz_api burst=40 nodelay;
        proxy_pass http://backend:8080/;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
