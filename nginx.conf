map $http_x_forwarded_proto $ccz_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    # HTML e respostas autenticadas nao devem persistir em caches compartilhados.
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Os payloads do roteador do Next sao pedidos com ponto separando os segmentos
    # (__next.news.$d$slug.__PAGE__.txt) e gravados no export com barra
    # (__next.news/$d$slug/__PAGE__.txt). Troca um ponto por vez, ate acabar.
    rewrite "^(.*/__next\.[^/.]+(?:/[^/.]+)*)\.(.+\.txt)$" "$1/$2" last;

    location ~ "/__next\.[^/]+/" {
        default_type text/x-component;
        try_files $uri =404;
    }

    client_max_body_size 10m;

    # Site, painel e Java compartilham a mesma URL publica.
    location /api/ {
        proxy_hide_header Cache-Control;
        proxy_pass http://backend:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $ccz_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }
}
