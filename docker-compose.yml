services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ccz
      POSTGRES_USER: ccz
      POSTGRES_PASSWORD: ccz
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccz -d ccz"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../SiteInstitucionalCCZ-BackEnd
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ccz
      SPRING_DATASOURCE_USERNAME: ccz
      SPRING_DATASOURCE_PASSWORD: ccz
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SIMULATE: ${NEXT_PUBLIC_SIMULATE:-0}
    depends_on:
      - backend
    ports:
      - "4000:80"

volumes:
  db-data:
