services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ccz
      POSTGRES_USER: ccz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccz -d ccz"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY no ambiente}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY no ambiente}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY no ambiente}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY no ambiente}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set ccz http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do sleep 2; done
        mc mb --ignore-existing ccz/denuncias-ccz

  backend:
    build:
      context: ${CCZ_BACKEND_PATH:-../SiteInstitucionalCCZ-BackEnd}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ccz
      SPRING_DATASOURCE_USERNAME: ccz
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4000}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Fortaleza
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Defina ADMIN_DEFAULT_PASSWORD no ambiente}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY no ambiente}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY no ambiente}
      MINIO_BUCKET_NAME: denuncias-ccz
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SIMULATE: ${NEXT_PUBLIC_SIMULATE:-0}
    depends_on:
      - backend
    ports:
      - "4000:80"

volumes:
  db-data:
  minio-data:
