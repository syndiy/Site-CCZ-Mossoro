# VM pequena (1 GB de RAM, ex.: Oracle VM.Standard.E2.1.Micro).
#
# A VM nao compila nada: as imagens ccz-frontend e ccz-backend sao geradas em
# outra maquina e carregadas com `docker load`. As fotos ficam num storage S3
# externo (Oracle Object Storage), porque o MinIO nao cabe na memoria e suas
# imagens publicas deixaram de ser distribuidas.
#
#   docker compose -f deploy/docker-compose.micro.yml --env-file .env up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Valores para caber junto com o Java em 1 GB.
    command: >
      postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=2MB
      -c maintenance_work_mem=16MB -c effective_cache_size=96MB
    environment:
      POSTGRES_DB: ccz
      POSTGRES_USER: ccz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccz -d ccz"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ccz-backend:latest
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ccz
      SPRING_DATASOURCE_USERNAME: ccz
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Defina SITE_DOMAIN}
      JAVA_TOOL_OPTIONS: >-
        -Xmx256m -Xss512k -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m
        -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Duser.timezone=America/Fortaleza
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Defina ADMIN_DEFAULT_PASSWORD}
      MINIO_ENDPOINT: ${S3_ENDPOINT:?Defina S3_ENDPOINT}
      MINIO_REGION: ${S3_REGION:?Defina S3_REGION}
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY}
      MINIO_BUCKET_NAME: ${S3_BUCKET:-denuncias-ccz}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ccz-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Defina SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  db-data:
  caddy-data:
  caddy-config:
